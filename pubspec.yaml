name: aura_marketplace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - apps/*
  - packages/*

dev_dependencies:
  melos: ^8.10.1

dependency_overrides:
  # melos ^8.10.1 requires cli_util >=0.5.0 <0.7.0 (for BaseDirectories),
  # while flutter_launcher_icons 0.14.4 depends on cli_util ^0.4.1 (only uses cli_logging).
  cli_util: ">=0.5.0 <0.7.0"

melos:
  command:
    bootstrap:
      runPubGetInParallel: true

      environment:
        sdk: ^3.13.0

      dependencies:
        get_it: ^9.3.0
        injectable: ^3.0.0
        dio: ^5.11.1
        equatable: ^2.0.7
        freezed_annotation: ^3.1.0
        json_annotation: ^4.12.0
        flutter_bloc: ^9.1.1
        flutter_secure_storage: ^9.2.4

      dev_dependencies:
        flutter_flavorizr: ^2.6.0
        flutter_launcher_icons: 0.14.4
        injectable_generator: ^3.1.3
        build_runner: 2.15.0
        freezed: ^4.0.1
        json_serializable: ^6.15.2
        bloc_test: ^10.0.0
        mocktail: ^1.0.4

  scripts:
    get:
      exec:
        command: flutter pub get
      description: Fetch dependencies across the workspace

    analyze:
      exec:
        command: flutter analyze
      description: Static analysis across the workspace

    format:
      exec:
        command: dart format .
      description: Format all Dart code

    generate:
      exec:
        command: dart run build_runner build --delete-conflicting-outputs
        concurrency: 1
      packageFilters:
        dependsOn: build_runner
      description: Run build_runner in every package that uses it

    test:
      exec:
        command: flutter test
      packageFilters:
        dirExists: test
      description: Run tests in every package that has a test/ directory
