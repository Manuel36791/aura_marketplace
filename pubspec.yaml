name: aura_marketplace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - apps/**
  - packages/**

dev_dependencies:
  melos: ^8.10.1

dependency_overrides:
  cli_util: ^0.4.1

melos:
  command:
    bootstrap:
      runPubGetInParallel: true

      environment:
        sdk: ^3.13.0

      dependencies:
        get_it: ^9.3.0
        injectable: ^3.0.0
        dio: ^5.11.1

      dev_dependencies:
        flutter_flavorizr: ^2.6.0
        flutter_launcher_icons: 0.14.4
        injectable_generator: ^3.1.3
        build_runner: 2.15.0

  scripts:
    get:
      exec:
        command: flutter pub get
      description: Fetch dependencies across the workspace

    analyze:
      exec:
        command: flutter analyze
      description: Static analysis across the workspace

    format:
      exec:
        command: dart format .
      description: Format all Dart code

    generate:
      exec:
        command: dart run build_runner build --delete-conflicting-outputs
        concurrency: 1
      packageFilters:
        dependsOn: build_runner
      description: Run build_runner in every package that uses it

    test:
      exec:
        command: flutter test
      packageFilters:
        dirExists: test
      description: Run tests in every package that has a test/ directory
