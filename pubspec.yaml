name: aura_marketplace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - apps/**
  - packages/**

dev_dependencies:
  melos: ^8.9.0

dependency_overrides:
  cli_util: ^0.4.1

melos:
  command:
    bootstrap:
      runPubGetInParallel: true

      environment:
        sdk: ^3.13.0

      dependencies:

      dev_dependencies:
        flutter_flavorizr: ^2.6.0
        flutter_launcher_icons: 0.14.4

  scripts:
    get:
      exec:
        command: flutter pub get
      description: Fetch dependencies across the workspace

    analyze:
      exec:
        command: flutter analyze
      description: Static analysis across the workspace

    format:
      exec:
        command: dart format .
      description: Format all Dart code

    test:
      exec:
        command: --dir-exists=test -- flutter test
      description: Run tests in every package that has a test/ directory
